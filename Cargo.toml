[workspace]
members = [
    "crates/normfix-actions",
    "crates/normfix-c-actions",
    "crates/normfix-c-semantics",
    "crates/normfix-c-syntax",
    "crates/normfix-cli",
    "crates/normfix-core",
    "crates/normfix-destructive",
    "crates/normfix-engine",
    "crates/normfix-header",
    "crates/normfix-makefile",
    "crates/normfix-markdown",
    "crates/normfix-oracle",
    "crates/normfix-project",
    "crates/normfix-report",
    "crates/normfix-cache",
]
resolver = "3"

[workspace.package]
version = "0.4.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
anstyle = "1.0"
blake3 = "1.8"
camino = { version = "1.2", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
comrak = { version = "0.52", default-features = false }
filetime = "0.2"
ignore = "0.4"
once_cell = "1.21"
rayon = "1.11"
redb = "=2.6.0"
regex = "1.12"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "2.7"
tempfile = "3.20"
thiserror = "2.0"
tree-sitter = "=0.26.11"
tree-sitter-c = "=0.24.2"
unicode-width = "0.2"
wait-timeout = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = [
    "crates/normfix-actions",
    "crates/normfix-c-actions",
    "crates/normfix-c-semantics",
    "crates/normfix-c-syntax",
    "crates/normfix-cli",
    "crates/normfix-core",
    "crates/normfix-destructive",
    "crates/normfix-engine",
    "crates/normfix-header",
    "crates/normfix-i18n",
    "crates/normfix-makefile",
    "crates/normfix-markdown",
    "crates/normfix-oracle",
    "crates/normfix-project",
    "crates/normfix-report",
    "crates/normfix-cache",
    "crates/normfix-wasm",
]
exclude = ["fuzz"]
default-members = ["crates/normfix-cli"]
resolver = "3"

[workspace.package]
version = "1.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Vinicius Neves Costa"]
description = "Safe automatic fixes and actionable diagnostics for the 42 Norm"
repository = "https://github.com/viniciusnevescosta/normfix"
homepage = "https://github.com/viniciusnevescosta/normfix"
readme = "README.md"
keywords = ["42-school", "c", "formatter", "norminette", "linter"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[workspace.dependencies]
anyhow = "1.0"
anstyle = "1.0"
# The renderer rustc itself uses. Its only dependencies are `anstyle` and
# `unicode-width`, both already listed here, so pointing at the source of an
# error costs no new transitive crate. Its declared MSRV matches this workspace.
annotate-snippets = "0.12"
blake3 = "1.8"
camino = { version = "1.2", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
comrak = { version = "0.54", default-features = false }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
filetime = "0.2"
# 0.4.30 uses `let` chains, which need a newer compiler than the declared MSRV,
# and the crate publishes no `rust-version` for the resolver to honor. Raise this
# bound only together with a documented MSRV change.
ignore = ">=0.4.29, <0.4.30"
once_cell = "1.21"
proptest = "1.11"
rayon = "1.11"
redb = "=2.6.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "3.1"
tempfile = "3.20"
thiserror = "2.0"
tree-sitter = "=0.26.11"
tree-sitter-c = "=0.24.2"
unicode-normalization = "0.1"
unicode-width = "0.2"
wait-timeout = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

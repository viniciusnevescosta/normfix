name: Browser playground

on:
  push:
    branches: [main]
    paths:
      - "crates/normfix-c-actions/**"
      - "crates/normfix-c-syntax/**"
      - "crates/normfix-core/**"
      - "crates/normfix-wasm/**"
      - "web/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/playground.yml"
  pull_request:
    paths:
      - "crates/normfix-c-actions/**"
      - "crates/normfix-c-syntax/**"
      - "crates/normfix-core/**"
      - "crates/normfix-wasm/**"
      - "web/**"
      - "docs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/playground.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite and WebAssembly site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install browser compilation target
        run: rustup target add wasm32-unknown-unknown
      - name: Install matching JavaScript binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Install locked site dependencies
        run: npm ci
      - name: Reject known site dependency advisories
        run: npm audit --audit-level=moderate
      # The playground is a page, and until now nothing here read its
      # TypeScript for anything but types. oxlint and oxfmt are Rust tools,
      # which is why they can run on every push without being noticed.
      # Biome replaced oxlint and oxfmt in 1.9: it reads the `<script>` block
      # of a `.svelte` file, which they did not, and the playground is becoming
      # Svelte. Neither reads a template, so component tests remain the only
      # cover on that half.
      - name: Check the site with Biome
        run: npm run check:all
      - name: Test the playground
        run: npm test --workspace normfix-playground
      - name: Build the playground and the documentation
        run: npm run build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: normfix-playground
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

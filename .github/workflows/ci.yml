name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run all tests
        run: cargo test --workspace --all-targets --locked
      - name: Deny Clippy warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Deny rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  windows:
    name: Tests on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The compatibility policy does not claim Windows yet, and this job is what
    # will let it: every platform difference found so far — a protected-scope
    # guard that recognized nothing, a durability step that made every write
    # fail, a backup directory that did not resolve, a process bound that bound
    # one process — was invisible until the suite ran here. Without this job the
    # next change reintroduces one silently.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Show pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build the workspace
        run: cargo build --workspace --locked
      - name: Run all tests
        run: cargo test --workspace --all-targets --locked
      # The release job only fires on a tag, so its archive step would first be
      # exercised during a publication. Running the same script here means a
      # mistake in it fails on the change that caused it.
      - name: Build the release archive
        shell: pwsh
        run: |
          cargo build --release --locked -p normfix --target ${{ matrix.target }}
          ./packaging/archive.ps1 -Target "${{ matrix.target }}" -Archive "normfix-${{ matrix.target }}.zip"
      # The installer is a POSIX script and unpacks the Windows archive with
      # whichever tool is present. Which one that is was an assumption until
      # this step: it runs the same chain, in the same shell the installer runs
      # in, against an archive this job just built.
      - name: Unpack the archive the way the installer does
        shell: bash
        run: |
          set -eu
          archive="dist/normfix-${{ matrix.target }}.zip"
          work="$(mktemp -d)"
          if command -v unzip >/dev/null 2>&1; then
            echo "using unzip"
            unzip -q "$archive" -d "$work"
          elif tar -xf "$archive" -C "$work" 2>/dev/null; then
            echo "using tar"
          elif command -v powershell >/dev/null 2>&1; then
            echo "using powershell"
            powershell -NoProfile -NonInteractive -Command \
              "Expand-Archive -Path '$(cygpath -w "$archive")' -DestinationPath '$(cygpath -w "$work")' -Force"
          else
            echo "no extractor available to the installer" >&2
            exit 1
          fi
          test -f "$work/normfix.exe"
          "$work/normfix.exe" --version
      # Passing this project's own tests says the code works on the platform.
      # It says nothing about the tool it defers to. The official Norminette is
      # a Python program and runs on Windows, and whether the adapter drives it
      # correctly there — argument passing, exit codes, output decoding — is the
      # evidence the compatibility policy needs before it can claim Windows.
      - name: Install Python for the official checker
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install exact official Norminette
        run: python -m pip install --disable-pip-version-check norminette==3.3.59
      - name: Exercise the official Norminette adapter
        run: cargo test --locked -p normfix-oracle installed_official_norminette_smoke_test -- --ignored
      - name: Prove a run never worsens the official result
        run: cargo test --locked -p normfix-engine --test differential -- --ignored

  freebsd:
    name: Tests on FreeBSD x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # GitHub has no FreeBSD runner, so the suite runs in a virtual machine on
      # this one. Without it the platform would be cross-compiled and never
      # executed, which is the difference between shipping a binary and
      # supporting a system.
      - name: Run the suite on FreeBSD
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg install -y curl git python311
          run: |
            set -eu
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.97.1
            . "$HOME/.cargo/env"
            cargo build --workspace --locked
            cargo test --workspace --all-targets --locked
            # The same standard Windows is held to: the platform drives the real
            # checker and proves the differential property there, rather than
            # inheriting either from Linux because both are Unix.
            python3.11 -m ensurepip --upgrade
            python3.11 -m pip install --user norminette==3.3.59
            PATH="$HOME/.local/bin:$PATH"
            export PATH
            norminette --version
            cargo test --locked -p normfix-oracle installed_official_norminette_smoke_test -- --ignored
            cargo test --locked -p normfix-engine --test differential -- --ignored

  coverage:
    name: Line coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Informational: coverage guides where to test next, and a percentage is a
    # poor gate for a project whose risk is concentrated in refusal paths.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage
        run: cargo llvm-cov --workspace --locked --summary-only

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Informational. A shared runner is too noisy to gate on, but a benchmark
    # that never runs is a benchmark that stops compiling.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Measure the native action pipeline
        run: cargo bench -p normfix-c-actions --locked -- --output-format bencher | tee bench.txt
      - name: Upload measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmarks
          path: bench.txt
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    name: Dependency advisories, licenses, and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: cargo-deny
      - name: Check dependencies
        run: cargo deny --all-features check
      - name: Test installer and package manifests
        run: |
          sh web/tests/install.sh
          sh packaging/test-render-manifests.sh
      - name: Install supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked site dependencies
        run: npm ci
      - name: Check site dependency advisories
        run: npm audit --audit-level=moderate

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test workspace with MSRV
        run: cargo +1.85.0 test --workspace --all-targets --locked

  platforms:
    name: Tests on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run all tests
        run: cargo test --workspace --all-targets --locked
      - name: Install Python for the official checker
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install exact official Norminette
        run: python -m pip install --disable-pip-version-check norminette==3.3.59
      # The analyzer runs inside the normal pipeline, which requires the
      # official checker, so this job needs it even though it is not the job
      # that exists to exercise the oracle.
      - name: Exercise the deep analyzer with the system compiler
        run: cargo test --locked -p normfix-engine --test analyzer -- --ignored

  official-tools:
    name: Official Norminette and C compiler
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install exact official Norminette
        run: python -m pip install --disable-pip-version-check norminette==3.3.59
      - name: Exercise official Norminette adapter
        run: cargo test --locked -p normfix-oracle installed_official_norminette_smoke_test -- --ignored
      - name: Exercise system C compiler adapter
        run: cargo test --locked -p normfix-oracle installed_compiler_smoke_test -- --ignored
      - name: Prove a run never worsens the official result
        run: cargo test --locked -p normfix-engine --test differential -- --ignored
      - name: Exercise the deep analyzer with GCC
        env:
          NORMFIX_TEST_CC: gcc
        run: cargo test --locked -p normfix-engine --test analyzer -- --ignored
      - name: Exercise the deep analyzer with Clang
        env:
          NORMFIX_TEST_CC: clang
        run: cargo test --locked -p normfix-engine --test analyzer -- --ignored
      # Valgrind exists on Linux and FreeBSD and not on macOS or Windows, so
      # this is the job that decides whether the feature can be claimed at all.
      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Drive the real leak checker
        run: cargo test --locked -p normfix-oracle installed_valgrind_smoke_test -- --ignored
      # The adapter passing says the parser is right. This says the command a
      # student actually types does what it claims: it runs a program that
      # leaks, reports the loss, and exits 1 the way every other finding does.
      - name: Check a leaking program end to end
        run: |
          set -eu
          printf '#include <stdlib.h>\nint main(void){char *p = malloc(2048); (void)p; return 0;}\n' > /tmp/leak.c
          cc -g -o /tmp/leak /tmp/leak.c
          cargo build --release --locked -p normfix
          set +e
          output="$(./target/release/normfix leaks --force /tmp/leak 2>&1)"
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1 || { echo "a leak must exit 1, got $status" >&2; exit 1; }
          echo "$output" | grep -q 2048 || { echo "the report did not name the lost bytes" >&2; exit 1; }
          echo "$output" | grep -qi "not a proof" || { echo "the caveat was not printed" >&2; exit 1; }

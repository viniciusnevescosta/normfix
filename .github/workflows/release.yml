name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Release quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require an annotated tag from main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "$GITHUB_REF_NAME must be an annotated tag" >&2
            exit 1
          fi
          tagged_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "$GITHUB_REF_NAME does not point to a commit contained in main" >&2
            exit 1
          fi
      - name: Require tag to match workspace version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "tag version $tag_version does not match Cargo.toml $manifest_version" >&2
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run all tests
        run: cargo test --workspace --all-targets --locked
      - name: Install Python for the official checker
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install exact official Norminette
        run: python -m pip install --disable-pip-version-check norminette==3.3.59
      - name: Exercise official Norminette and system compiler adapters
        run: |
          cargo test --locked -p normfix-oracle installed_official_norminette_smoke_test -- --ignored
          cargo test --locked -p normfix-oracle installed_compiler_smoke_test -- --ignored
          cargo test --locked -p normfix-engine --test differential -- --ignored
      # The declared MSRV is a promise the documentation makes about building
      # from source. It was checked in CI but not here, so 1.7.0 published a
      # workspace that the compiler it names cannot build.
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build workspace with the declared MSRV
        run: cargo +1.85.0 build --workspace --locked
      - name: Deny Clippy warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Deny rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Install supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked site dependencies
        run: npm ci
      - name: Reject known site dependency advisories
        run: npm audit --audit-level=moderate
      - name: Install browser compilation tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - name: Build playground and documentation
        run: npm run build

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: normfix-x86_64-linux-gnu.tar.gz
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: normfix-aarch64-linux-gnu.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: normfix-x86_64-macos.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: normfix-aarch64-macos.tar.gz
          # Windows gets `.zip`, the format the platform opens by itself. A
          # `.tar.gz` would ask a student to install a tool before they can
          # install the tool.
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: normfix-x86_64-windows.zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: normfix-aarch64-windows.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
      - name: Install release target
        run: rustup target add ${{ matrix.target }}
      - name: Build locked release binary
        run: cargo build --release --locked -p normfix --target ${{ matrix.target }}
      - name: Exercise release binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/normfix"
          [ "${{ runner.os }}" = "Windows" ] && binary="$binary.exe"
          "$binary" --version
      - name: Create release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stage="dist/${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/normfix" "$stage/normfix"
          cp README.md LICENSE "$stage/"
          tar -czf "dist/${{ matrix.archive }}" -C "$stage" normfix README.md LICENSE
      - name: Create release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/archive.ps1 -Target "${{ matrix.target }}" -Archive "${{ matrix.archive }}"
      - name: Attest release archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ matrix.archive }}
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  # FreeBSD has no GitHub runner, so its archive is built inside the same kind of
  # virtual machine the test job uses. Cross-compiling it from Linux would need a
  # sysroot for the C dependencies and would publish a binary that never ran on
  # the system it targets.
  build-freebsd:
    name: Build x86_64-unknown-freebsd
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
      - name: Build and archive inside FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg install -y curl git
          run: |
            set -eu
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain 1.97.1
            . "$HOME/.cargo/env"
            cargo build --release --locked -p normfix
            target/release/normfix --version
            mkdir -p dist/stage
            cp target/release/normfix dist/stage/normfix
            cp README.md LICENSE dist/stage/
            tar -czf dist/normfix-x86_64-freebsd.tar.gz -C dist/stage normfix README.md LICENSE
      - name: Attest release archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/normfix-x86_64-freebsd.tar.gz
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-x86_64-unknown-freebsd
          path: dist/normfix-x86_64-freebsd.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [build, build-freebsd]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The manifest renderer lives in this repository, so the job that writes
      # the tap and the bucket needs the source it is releasing.
      - name: Check out tagged source
        uses: actions/checkout@v7
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: dist
        run: shasum -a 256 -- *.tar.gz *.zip > SHA256SUMS
      - name: Attest checksum manifest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/SHA256SUMS
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # A SemVer pre-release carries a hyphen after the version core, and
          # must not be published as the latest stable download.
          prerelease=()
          case "${GITHUB_REF_NAME#v}" in
            *-*) prerelease=(--prerelease --latest=false) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; release assets are immutable" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --verify-tag --generate-notes --title "normfix ${GITHUB_REF_NAME#v}" "${prerelease[@]}"
          # Every published release opens with the two commands that install it,
          # so a reader never has to leave the page to try the version they are
          # looking at. A pre-release pins its own tag, because the unpinned
          # installer and the Homebrew formula both track the latest stable.
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Install"
            echo
            case "$version" in
              *-*)
                echo "This is a pre-release. The pinned installer gives you exactly this build:"
                echo
                echo '```sh'
                echo "NORMFIX_VERSION=${GITHUB_REF_NAME} sh -c \"\$(curl -fsSL https://normfix.vercel.app/install.sh)\""
                echo '```'
                echo
                echo "Or with Homebrew, which follows the tap formula and therefore the newest published release:"
                echo
                echo '```sh'
                echo 'brew install viniciusnevescosta/normfix/normfix'
                echo '```'
                echo
                echo "Already on a pre-release? \`upgrade\` follows the preview channel and moves you here:"
                echo
                echo '```sh'
                echo 'normfix upgrade   # a curl or source install'
                echo 'brew upgrade viniciusnevescosta/normfix/normfix   # a Homebrew install'
                echo '```'
                echo
                echo "\`normfix upgrade\` refuses on a Homebrew-managed binary and points at the second command, because replacing a file the formula still describes leaves \`brew\` as the only way back to a consistent state."
                echo
                echo "The unpinned \`curl ... | sh\` form installs the latest stable release instead, and a stable install is never moved onto a pre-release."
                ;;
              *)
                echo '```sh'
                echo 'curl -fsSL https://normfix.vercel.app/install.sh | sh'
                echo '```'
                echo
                echo "That works on Linux, macOS, and Windows — on Windows from any POSIX shell, meaning Git Bash, MSYS2, Cygwin, or WSL."
                echo
                echo "If you already use a package manager, Homebrew and Scoop install the same release:"
                echo
                echo '```sh'
                echo 'brew install viniciusnevescosta/normfix/normfix'
                echo '```'
                echo
                echo '```powershell'
                echo 'scoop bucket add normfix https://github.com/viniciusnevescosta/scoop-normfix'
                echo 'scoop install normfix'
                echo '```'
                echo
                echo "Already have normfix? Upgrade in place, with the download verified against its published checksum:"
                echo
                echo '```sh'
                echo 'normfix upgrade   # a curl or source install'
                echo 'brew upgrade viniciusnevescosta/normfix/normfix   # a Homebrew install'
                echo '```'
                echo
                echo "\`normfix upgrade\` refuses on a Homebrew-managed binary and points at the second command, because replacing a file the formula still describes leaves \`brew\` as the only way back to a consistent state."
                ;;
            esac
            echo
            echo "The official [Norminette](https://github.com/42School/norminette) is the only requirement. Install it by following the instructions in its own repository, which is the only source that stays correct when they change. The tested baseline is 3.3.59; another parseable release continues with a compatibility advisory."
            echo
            echo "Verify the download against \`SHA256SUMS\` below; every archive carries build provenance."
            echo
            echo "Full notes for this version: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)"
            echo
            echo "---"
            echo
          } > release-header.md
          gh release view "$GITHUB_REF_NAME" --json body -q .body > generated-notes.md
          cat release-header.md generated-notes.md > release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
      # Both package managers verify a download against a checksum before
      # installing it, and that checksum can only exist once the artifacts do.
      # Editing the manifests by hand therefore always lags a release by one,
      # which is how the tap sat on 1.5.0 while four releases went out. They are
      # written here instead, from the SHA256SUMS this job just published.
      #
      # A missing token is not a failure: the release is already out, and the
      # step says plainly that the manifests were not pushed.
      - name: Update the Homebrew tap and the Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        shell: bash
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PACKAGING_TOKEN is not set; the Homebrew formula and Scoop manifest were not updated for ${GITHUB_REF_NAME}."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          packaging/render-manifests.sh "$version" dist/SHA256SUMS rendered
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          publish() {
            repository="$1"
            source_file="$2"
            target="$3"
            work=$(mktemp -d)
            if ! gh repo clone "$repository" "$work" -- --depth 1 >/dev/null 2>&1; then
              echo "::warning::could not clone $repository; $target was not updated."
              return 0
            fi
            mkdir -p "$(dirname "$work/$target")"
            cp "$source_file" "$work/$target"
            git -C "$work" add "$target"
            if git -C "$work" diff --cached --quiet; then
              echo "$repository already describes $version"
              return 0
            fi
            git -C "$work" commit -m "normfix $version"
            git -C "$work" push
          }
          publish viniciusnevescosta/homebrew-normfix rendered/normfix.rb Formula/normfix.rb
          publish viniciusnevescosta/scoop-normfix rendered/normfix.json bucket/normfix.json

[package]
name = "normfix-makefile"
version = "0.4.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
normfix-header = { path = "../normfix-header" }
regex = "1.12"
thiserror = "2.0"
unicode-width = "0.2"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[package]
name = "normfix-header"
version = "0.4.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1.12"
sha2 = "0.10"
thiserror = "2.0"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
